[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-development-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer",
  "pydantic>=2",
  "pyyaml",
]

[project.scripts]
ai-development-orchestrator = "ai_development_orchestrator.cli:app"
agentpilot = "ai_development_orchestrator.cli:app"

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["E501", "BLE001", "S112", "S603", "S607", "S101", "F841", "S110", "B904", "SIM105", "S108", "E402", "C901"]
